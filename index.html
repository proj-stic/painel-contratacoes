<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Contratações - STIC TJES</title>
<style>
:root{--blue:#1C5CA2;--green:#2E7D32;--brown:#9C5A2B;--gray:#4B5563;--gray-light:#9CA3AF;--cream:#F3F2ED;--ink:#1F2937;--line:#E2E1DA}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--ink);padding:16px 14px 40px;max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h1{font-size:21px;margin:0;font-family:Cambria,Georgia,serif}.sub{font-size:12px;color:var(--gray);margin-top:2px}
.pill{background:#E4EEF9;color:var(--blue);font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:10px;white-space:nowrap;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0 10px}
.stat{background:var(--cream);border:2px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font:inherit;text-align:left}
.stat.on{border-color:var(--ink)}.stat span{font-size:9.5px;color:var(--gray);line-height:1.2;max-width:60%}.stat b{font-family:Cambria,Georgia,serif;font-size:22px;text-align:right}
.stat.all{grid-column:1/-1}
.filters{display:flex;gap:6px;align-items:center;margin:0 0 14px;flex-wrap:wrap;font-size:11px;color:var(--gray)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.card>button{all:unset;display:block;width:100%;padding:12px 14px;cursor:pointer;box-sizing:border-box}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ttl{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;flex:none}
.upd{font-size:10px;color:var(--gray);background:var(--cream);padding:3px 7px;border-radius:6px;white-space:nowrap;text-align:center}.upd i{display:block;font-style:normal;font-size:8px;color:var(--gray-light)}
.mod{font-size:12px;color:var(--gray);margin:2px 0 8px 17px}
.badge{display:inline-block;font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:7px;margin-bottom:8px}
.bar{height:7px;background:var(--cream);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.det{display:none;padding:0 14px 14px;font-size:13px;line-height:1.45}.card.open .det{display:block}
.det .st{border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px}
.kv{margin:0 0 6px}.kv b{color:var(--gray);font-weight:600}.kv.resp{margin-bottom:14px}
.det a{color:var(--blue);font-weight:600;word-break:break-all}
footer{font-size:11px;color:var(--gray-light);text-align:center;margin-top:20px}
</style></head><body>
<header><div><h1>Painel de Contratações</h1><div class="sub">STIC - TJES</div></div>
<a class="pill" href="Painel_Contratacoes_STIC.pdf" title="Versão em PDF">Status em 08/10/2026 às 23:40 <span>🖨</span></a></header>
<div class="stats" id="stats"></div>
<div class="filters">Fonte de Recurso: <span id="fonte"></span></div>
<div id="cards"></div>
<footer>Fonte: planilha de acompanhamento da STIC</footer>
<script>
const D=[{"t": "Service Desk", "sei": "7001769-17.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3243710", "f": "Próprio", "resp": "Jeferson Mendes", "st": "Pesquisas de mercado enviadas à área técnica para conferir se atendem ao que foi pedido e se os preços estão dentro do mercado. Próximo passo: devolver à área de compras com a planilha comparativa para formar a cesta de preços.", "loc": "STIC", "mod": "Licitação", "badge": "Análise das pesquisas", "p": 35, "up": "08/10 - 23:09"}, {"t": "Consultoria especializada IA", "sei": "7010724-37.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3644851", "f": "Próprio", "resp": "Teófilo Dias", "st": "Minuta do contrato conferida e de acordo com as recomendações recebidas. Restam ajustes finais de preenchimento e a conferência da regularidade da contratada. Próximo passo: coletar as assinaturas.", "loc": "STIC", "mod": "Contratação Direta", "badge": "Ajustes da minuta", "p": 80, "up": "08/10 - 18:41"}, {"t": "Cabeamento Estruturado - 2ª Etapa", "sei": "7008191-08.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3519541", "f": "BID", "resp": "Márcio Flávio", "st": "Resumo do contrato publicado no Diário Oficial. A publicação no portal nacional está pendente de regularização cadastral, e a garantia contratual está em registro contábil. Próximo passo: concluir o registro e publicar no portal assim que o cadastro for regularizado.", "loc": "Coordenação de Contabilidade", "mod": "Adesão ARP", "badge": "Publicação pendente", "p": 88, "up": "07/10 - 18:54"}, {"t": "Link de Internet", "sei": "7006076-14.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3430944", "f": "Próprio", "resp": "Richard Joanathan", "st": "Contratos autorizados e com resumo publicado. O processo está na área contábil para registro das garantias contratuais. Próximo passo: seguir para o início da execução.", "loc": "Coordenação de Contabilidade", "mod": "Adesão ARP", "badge": "Registro de garantias", "p": 85, "up": "06/10 - 16:53"}, {"t": "Solução Grandes Mídias TJRO", "sei": "7004115-38.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3356441", "f": "Próprio", "resp": "Teófilo Dias", "st": "O proponente apoiou a adoção da solução de repositório de provas digitais, com requisitos adicionais, e pediu a compra imediata de insumos de acondicionamento. Próximo passo: análise da Presidência e da Secretaria Geral.", "loc": "CGTIC", "mod": "Outros processos", "badge": "Análise da Presidência", "p": 20, "up": "02/10 - 19:01"}, {"t": "Link MPLS PRODEST", "sei": "7001098-91.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3214331", "f": "Próprio", "resp": "Karina Marques", "st": "Notas de empenho do contrato assinadas, garantindo a reserva do recurso. Próximo passo: devolver o processo à área responsável para dar andamento à execução.", "loc": "Seção de Empenho", "mod": "Contratação Direta", "badge": "Empenho assinado", "p": 92, "up": "02/10 - 10:59"}, {"t": "Aquisição de Computadores", "sei": "7010877-70.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3650348", "f": "Próprio", "resp": "João Luiz", "st": "Aberta demanda para aquisição de novos equipamentos de informática, visando modernizar e ampliar a capacidade dos postos de trabalho.", "loc": "STIC", "mod": "Adesão ARP", "badge": "Demanda aberta", "p": 10, "up": "20/09 - 20:58"}, {"t": "SOC", "sei": "7006364-93.2025.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=2875391&infra_sistema=100000100&infra_unidade_atual=1234&infra_hash=79807b3e6e4b9ec16e7eba0f555ffd0b080af78a2f3e85c732ae8afae2823e97", "f": "BID", "resp": "Robson Limaverde", "st": "Concluído ajuste orçamentário e contábil solicitado pelo órgão financiador, sem alteração no objeto da contratação.", "loc": "Unidade Coordenação de Programas", "mod": "Licitação", "badge": "Remanejamento concluído", "p": 45, "up": "10/09 - 17:48"}, {"t": "Outsourcing de Impressão", "sei": "7002289-11.2025.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=2680226", "f": "Próprio", "resp": "Jeferson Mendes", "st": "Em etapa de confecção dos artefatos de contratação.", "loc": "SECR-GER", "mod": "Licitação", "badge": "Elaboração de artefatos", "p": 20, "up": "31/07 - 15:45"}, {"t": "Hospedagem em Colocation", "sei": "7008104-52.2026.8.08.0000", "url": "https://sistemas.tjes.jus.br/sei/controlador.php?acao=procedimento_trabalhar&id_procedimento=3516106", "f": "Próprio", "resp": "Robson Limaverde", "st": "ATO que designa a Equipe de Planejamento de Contratação (EPC) para a contratação de Colocation, Cloud e Suporte Técnico do PJES, publicado.", "loc": "STIC", "mod": "Licitação", "badge": "Equipe designada", "p": 15, "up": "31/07 - 11:39"}];
const COL={"Adesão ARP":"#1C5CA2","Licitação":"#2E7D32","Contratação Direta":"#9C5A2B","Outros processos":"#6B7280"};
const TINT={"Adesão ARP":"#E4EEF9","Licitação":"#E6F2E7","Contratação Direta":"#F5EADF","Outros processos":"#ECEDEF"};
let mod="Todos",fonte="Todos";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stats(){const el=document.getElementById("stats");const names=["Todos",...Object.keys(COL).filter(k=>D.some(d=>d.mod===k))];
el.innerHTML=names.map(n=>{const c=n==="Todos"?D.length:D.filter(d=>d.mod===n).length;return `<button class="stat ${n==="Todos"?"all":""} ${mod===n?"on":""}" data-m="${n}"><span>${n==="Todos"?"Iniciativas em andamento":n}</span><b style="color:${COL[n]||"inherit"}">${c}</b></button>`}).join("");
el.querySelectorAll("button").forEach(b=>b.onclick=()=>{mod=b.dataset.m===mod&&mod!=="Todos"?"Todos":b.dataset.m;render()})}
function fontes(){document.getElementById("fonte").innerHTML=["Todos","Próprio","BID"].map(f=>`<button class="chip ${fonte===f?"on":""}" data-f="${f}">${f}</button>`).join("");
document.querySelectorAll("#fonte .chip").forEach(b=>b.onclick=()=>{fonte=b.dataset.f;render()})}
function cards(){const L=D.filter(d=>(mod==="Todos"||d.mod===mod)&&(fonte==="Todos"||d.f===fonte));
document.getElementById("cards").innerHTML=L.map((d,i)=>`<div class="card"><button aria-expanded="false"><div class="top"><div class="ttl"><span class="dot" style="background:${COL[d.mod]}"></span>${esc(d.t)}</div><div class="upd"><i>Atualização</i>${d.up}</div></div>
<div class="mod">${d.mod}</div><span class="badge" style="background:${TINT[d.mod]};color:${COL[d.mod]}">${esc(d.badge)}</span><div class="bar"><i style="width:${d.p}%;background:${COL[d.mod]}"></i></div></button>
<div class="det"><div class="st">${esc(d.st)}</div><p class="kv resp"><b>Responsável:</b> ${esc(d.resp)} · ${esc(d.f)}</p><p class="kv"><b>Local atual:</b> ${esc(d.loc)}</p><p class="kv"><b>SEI:</b> <a href="${esc(d.url)}" target="_blank" rel="noopener">${d.sei}</a></p></div></div>`).join("")||"<p>Nenhum processo neste filtro.</p>";
document.querySelectorAll(".card>button").forEach(b=>b.onclick=()=>{const c=b.parentElement;const o=c.classList.toggle("open");b.setAttribute("aria-expanded",o)})}
function render(){stats();fontes();cards()}render();
</script></body></html>
